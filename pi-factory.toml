id = "pi-reviewer"
name = "pi-reviewer"
version = "0.1.0"
schema_version = 1
description = "Standalone read-only code review with prioritized findings"
state_dir = "~/.local/state/pi-reviewer"
session_dir = "~/.local/state/pi-reviewer/sessions"
pi_command = ["pi"]
thinking = "high"
tools = ["read", "grep", "find", "ls", "review_shell"]
system_prompt = "reviewer/prompts/review-system.md"

[provider]
id = "unconfigured"
source = "pi"

[model]
id = "unconfigured"
reasoning = true

[inherit]
providers = ["unconfigured"]

[[extensions]]
path = "reviewer/extensions/review-guard.ts"
