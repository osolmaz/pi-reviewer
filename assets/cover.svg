<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-label="pi-reviewer: a Git diff goes in, prioritized P0 to P3 findings come out">
  <defs>
    <style>
      .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="958" height="318" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <!-- Left: name, tagline, command line -->
  <g>
    <text x="56" y="132" class="mono" font-size="46" font-weight="700">
      <tspan fill="#58a6ff">pi</tspan><tspan fill="#e6edf3">-reviewer</tspan>
    </text>
    <text x="56" y="170" class="sans" font-size="17" fill="#8b949e">Standalone code review CLI built with Pi Factory.</text>
    <text x="56" y="196" class="sans" font-size="17" fill="#8b949e">Reviews a Git diff and returns prioritized findings.</text>

    <rect x="56" y="222" width="424" height="44" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="74" y="250" class="mono" font-size="16">
      <tspan fill="#3fb950">$</tspan><tspan fill="#e6edf3" dx="8">pi-reviewer --base main</tspan>
    </text>
  </g>

  <!-- Middle: diff card -->
  <g transform="translate(548,58)">
    <rect width="160" height="204" rx="10" fill="#161b22" stroke="#30363d"/>
    <circle cx="18" cy="18" r="4" fill="#f85149"/>
    <circle cx="32" cy="18" r="4" fill="#d29922"/>
    <circle cx="46" cy="18" r="4" fill="#3fb950"/>
    <text x="142" y="23" class="mono" font-size="12" fill="#8b949e" text-anchor="end">diff</text>
    <line x1="0" y1="34" x2="160" y2="34" stroke="#30363d"/>

    <rect x="14" y="48"  width="96"  height="8" rx="4" fill="#30363d"/>
    <rect x="14" y="66"  width="118" height="8" rx="4" fill="#30363d"/>
    <rect x="10" y="80"  width="140" height="16" rx="4" fill="#67060c" opacity="0.55"/>
    <rect x="14" y="84"  width="104" height="8" rx="4" fill="#f85149"/>
    <rect x="10" y="100" width="140" height="16" rx="4" fill="#033a16" opacity="0.65"/>
    <rect x="14" y="104" width="122" height="8" rx="4" fill="#3fb950"/>
    <rect x="10" y="120" width="140" height="16" rx="4" fill="#033a16" opacity="0.65"/>
    <rect x="14" y="124" width="86"  height="8" rx="4" fill="#3fb950"/>
    <rect x="14" y="146" width="110" height="8" rx="4" fill="#30363d"/>
    <rect x="14" y="164" width="72"  height="8" rx="4" fill="#30363d"/>
    <rect x="14" y="182" width="124" height="8" rx="4" fill="#30363d"/>
  </g>

  <!-- Arrow -->
  <line x1="716" y1="160" x2="752" y2="160" stroke="#8b949e" stroke-width="2.5" marker-end="url(#arrowhead)"/>

  <!-- Right: findings card -->
  <g transform="translate(764,58)">
    <rect width="160" height="204" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="14" y="23" class="mono" font-size="12" fill="#8b949e">findings</text>
    <line x1="0" y1="34" x2="160" y2="34" stroke="#30363d"/>

    <g class="mono" font-size="12" font-weight="700">
      <rect x="14" y="48" width="34" height="20" rx="5" fill="#67060c"/>
      <text x="31" y="62" fill="#ffa198" text-anchor="middle">P0</text>
      <rect x="58" y="53" width="88" height="8" rx="4" fill="#30363d"/>

      <rect x="14" y="86" width="34" height="20" rx="5" fill="#762d0a"/>
      <text x="31" y="100" fill="#f0883e" text-anchor="middle">P1</text>
      <rect x="58" y="91" width="72" height="8" rx="4" fill="#30363d"/>

      <rect x="14" y="124" width="34" height="20" rx="5" fill="#693e00"/>
      <text x="31" y="138" fill="#e3b341" text-anchor="middle">P2</text>
      <rect x="58" y="129" width="80" height="8" rx="4" fill="#30363d"/>

      <rect x="14" y="162" width="34" height="20" rx="5" fill="#0d419d"/>
      <text x="31" y="176" fill="#79c0ff" text-anchor="middle">P3</text>
      <rect x="58" y="167" width="60" height="8" rx="4" fill="#30363d"/>
    </g>
  </g>
</svg>
